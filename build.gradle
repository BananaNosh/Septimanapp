    // Top-level build file where you can add configuration options common to all sub-projects/modules.


    buildscript {
        ext {
            kotlin_version = '2.4.20'
            lifecycle_version = '2.8.7'
        }
        repositories {
            google()
            mavenCentral()
        }
        dependencies {
            classpath 'com.android.tools.build:gradle:9.4.1'
            classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
            classpath 'com.google.gms:google-services:4.4.4'
            classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.8'
            classpath "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin:2.3.12"
        }
    }

// Captured here: reading a root `ext` property from inside allprojects is an implicit
// parent-project lookup, which Gradle 10 turns into an error.
def lifecycleVersion = lifecycle_version
allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url = "https://repo1.maven.org/maven2/"
        }
        maven {
            url = "https://repo.spring.io/release"
        }
        maven {
            url = "https://repository.jboss.org/maven2"
        }
        maven {
            url = 'https://repo.jenkins-ci.org/public/'
        }
        maven { url = 'https://jitpack.io' }
    }
    configurations.configureEach {
        resolutionStrategy.eachDependency { DependencyResolveDetails details ->
            if (details.requested.group == 'androidx.lifecycle') {
                details.useVersion lifecycleVersion
            }
        }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
