apply plugin: 'com.android.application'


//apply plugin: 'kotlin-android-extensions'

//apply plugin: 'kotlin-kapt'

apply plugin: 'com.google.firebase.crashlytics'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.devtools.ksp'


android {
    compileSdk = 37
    defaultConfig {
        applicationId "com.nobodysapps.septimanapp"
        minSdk = 23
        targetSdk = 37
        versionCode = 31
        versionName = "1.15"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
    bundle {
        language {
            enableSplit = false
        }
    }
    namespace = 'com.nobodysapps.septimanapp'
    buildFeatures {
        viewBinding = true
        buildConfig = true
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'

    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.preference:preference-ktx:1.2.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // runner/rules bumped to 1.6.x so ActivityTestRule launches on Android 14+ devices.
    // Espresso is intentionally not used: its input-injection (and onView) crash on Android 16,
    // so these tests drive the views directly on the UI thread instead.
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'org.mockito:mockito-android:5.24.0'

    implementation platform('com.google.firebase:firebase-bom:30.2.0') // for importing all correct firebase libs
    implementation 'com.google.firebase:firebase-analytics-ktx'
    implementation 'com.google.firebase:firebase-crashlytics-ktx'



//    testImplementation 'org.powermock:powermock-api-mockito:1.6.2'
//    testImplementation 'org.powermock:powermock-module-junit4-rule-agent:1.6.2'
//    testImplementation 'org.powermock:powermock-module-junit4-rule:1.6.2'
//    testImplementation 'org.powermock:powermock-module-junit4:1.6.2'

    testImplementation 'androidx.test:core:1.4.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.24.0'
    testImplementation 'org.robolectric:robolectric:4.17'

    implementation 'com.github.BananaNosh:Android-Week-View:2.3.4-2'
    implementation 'org.osmdroid:osmdroid-wms:6.1.11'

    implementation 'com.google.code.gson:gson:2.9.0'

    implementation 'com.google.dagger:dagger:2.60.1'
    ksp 'com.google.dagger:dagger-compiler:2.60.1'
    implementation 'com.google.dagger:dagger-android:2.60.1'
    ksp 'com.google.dagger:dagger-android-processor:2.60.1'
    implementation 'com.google.dagger:dagger-android-support:2.60.1'

//    testImplementation 'org.robolectric:shadows-support-v4:3.0'
}

// Robolectric runs the unit tests against the targetSdk (37), whose android-all jar needs Java 21.
tasks.withType(Test).configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    // Robolectric reaches into JDK internals; see https://robolectric.org/getting-started/
    jvmArgs += [
        "--add-opens=java.base/java.lang=ALL-UNNAMED",
        "--add-opens=java.base/java.util=ALL-UNNAMED",
        "--add-opens=java.base/java.io=ALL-UNNAMED",
        "--add-opens=java.base/java.net=ALL-UNNAMED",
        "--add-opens=java.base/java.security=ALL-UNNAMED",
        "--add-opens=java.base/java.text=ALL-UNNAMED",
        "--add-opens=java.base/jdk.internal.access=ALL-UNNAMED",
        "--add-opens=java.desktop/java.awt.font=ALL-UNNAMED",
        "--add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED",
    ]
}
